<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUKA 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { background-color: #0d0d0d; color: white; }
    </style>
</head>
<body class="min-h-screen">
    <div id="app" class="container mx-auto p-4 max-w-4xl">
        
        <!-- 登录界面 -->
        <div v-if="!isLoggedIn" class="flex items-center justify-center h-screen">
            <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-sm border border-gray-700">
                <h1 class="text-2xl font-bold text-center text-red-500 mb-6">LUKA 管理后台</h1>
                <input v-model="password" type="password" placeholder="请输入管理密码" 
                       class="w-full bg-gray-700 border border-gray-600 rounded px-4 py-2 mb-4 focus:outline-none focus:border-red-500 text-white">
                <button @click="login" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded transition">
                    登录系统
                </button>
                <p class="text-xs text-gray-500 mt-4 text-center">默认密码: admin123</p>
            </div>
        </div>

        <!-- 管理界面 -->
        <div v-else>
            <!-- 顶部导航 -->
            <div class="flex justify-between items-center bg-gray-800 p-4 rounded-xl border border-gray-700 mb-6">
                <h1 class="text-xl font-bold text-red-500">LUKA 管理后台</h1>
                <button @click="logout" class="text-sm text-gray-400 hover:text-white">退出登录</button>
            </div>

            <!-- 数据概览 -->
            <div class="grid grid-cols-3 gap-4 mb-8">
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center">
                    <div class="text-gray-400 text-sm mb-1">总用户数</div>
                    <div class="text-2xl font-bold text-blue-400">{{ stats.userCount }}</div>
                </div>
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center">
                    <div class="text-gray-400 text-sm mb-1">卡牌总数</div>
                    <div class="text-2xl font-bold text-yellow-400">{{ stats.cardCount }}</div>
                </div>
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center">
                    <div class="text-gray-400 text-sm mb-1">盲盒总数</div>
                    <div class="text-2xl font-bold text-green-400">{{ stats.boxCount }}</div>
                </div>
            </div>

            <!-- 功能选项卡 -->
            <div class="flex gap-4 mb-4">
                <button @click="activeTab = 'users'" :class="['px-4 py-2 rounded-lg text-sm font-bold transition', activeTab === 'users' ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700']">用户管理</button>
                <button @click="activeTab = 'cards'" :class="['px-4 py-2 rounded-lg text-sm font-bold transition', activeTab === 'cards' ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700']">卡牌管理</button>
                <button @click="activeTab = 'boxes'" :class="['px-4 py-2 rounded-lg text-sm font-bold transition', activeTab === 'boxes' ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700']">盲盒管理</button>
            </div>

            <!-- 用户管理 -->
            <div v-if="activeTab === 'users'" class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-700 text-gray-300">
                        <tr><th class="p-3">用户名</th><th class="p-3">金币余额</th><th class="p-3">操作</th></tr>
                    </thead>
                    <tbody>
                        <tr v-for="user in users" :key="user.id" class="border-b border-gray-700 hover:bg-gray-750">
                            <td class="p-3">{{ user.username }}</td>
                            <td class="p-3 font-bold text-yellow-500">{{ user.coins }}</td>
                            <td class="p-3">
                                <button @click="promptEditCoins(user)" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1 rounded">修改金币</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 卡牌管理 -->
            <div v-if="activeTab === 'cards'">
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 mb-4 flex gap-2">
                    <input v-model="newCard.name" placeholder="卡牌名称" class="bg-gray-700 border border-gray-600 rounded px-3 py-1 text-sm w-1/3 text-white">
                    <select v-model="newCard.rarity" class="bg-gray-700 border border-gray-600 rounded px-3 py-1 text-sm text-white">
                        <option value="SSR">SSR</option><option value="SR">SR</option><option value="R">R</option>
                    </select>
                    <button @click="addCard" class="bg-green-600 hover:bg-green-700 text-white text-sm px-4 py-1 rounded">添加卡牌</button>
                </div>
                <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-700 text-gray-300">
                            <tr><th class="p-3">名称</th><th class="p-3">稀有度</th><th class="p-3">操作</th></tr>
                        </thead>
                        <tbody>
                            <tr v-for="card in cards" :key="card.id" class="border-b border-gray-700">
                                <td class="p-3">{{ card.name }}</td>
                                <td class="p-3"><span :class="{'text-yellow-400': card.rarity==='SSR', 'text-purple-400': card.rarity==='SR', 'text-blue-400': card.rarity==='R'}">{{ card.rarity }}</span></td>
                                <td class="p-3"><button @click="deleteCard(card.id)" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1 rounded">删除</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 盲盒管理 -->
            <div v-if="activeTab === 'boxes'">
                <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-700 text-gray-300">
                            <tr><th class="p-3">盲盒名称</th><th class="p-3">当前价格</th><th class="p-3">操作</th></tr>
                        </thead>
                        <tbody>
                            <tr v-for="box in boxes" :key="box.id" class="border-b border-gray-700">
                                <td class="p-3">{{ box.name }}</td>
                                <td class="p-3 font-bold text-yellow-500">{{ box.price }} 🪙</td>
                                <td class="p-3">
                                    <button @click="promptEditPrice(box)" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1 rounded">修改价格</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;
        // ⚠️ 如果你后端服务域名变了，请修改这里！
        const API_URL = 'https://luka-1i4g.onrender.com';

        createApp({
            setup() {
                const isLoggedIn = ref(false);
                const password = ref('');
                const activeTab = ref('users');
                const stats = ref({ userCount: 0, cardCount: 0, boxCount: 0 });
                const users = ref([]);
                const cards = ref([]);
                const boxes = ref([]);
                const newCard = ref({ name: '', rarity: 'R', imageUrl: '' });

                const headers = () => ({ 'x-admin-password': password.value });

                const login = async () => {
                    try {
                        await axios.get(`${API_URL}/api/admin/stats`, { headers: headers() });
                        isLoggedIn.value = true;
                        fetchData();
                    } catch (e) {
                        alert('密码错误！');
                    }
                };

                const logout = () => { isLoggedIn.value = false; password.value = ''; };

                const fetchData = async () => {
                    const h = headers();
                    const [s, u, c, b] = await Promise.all([
                        axios.get(`${API_URL}/api/admin/stats`, { headers: h }),
                        axios.get(`${API_URL}/api/admin/users`, { headers: h }),
                        axios.get(`${API_URL}/api/admin/cards`, { headers: h }),
                        axios.get(`${API_URL}/api/admin/boxes`, { headers: h })
                    ]);
                    stats.value = s.data; users.value = u.data; cards.value = c.data; boxes.value = b.data;
                };

                const promptEditCoins = async (user) => {
                    const val = prompt(`修改 ${user.username} 的金币数量（当前: ${user.coins}）`, user.coins);
                    if (val !== null) {
                        await axios.put(`${API_URL}/api/admin/users/${user.id}/coins`, { coins: val }, { headers: headers() });
                        fetchData();
                    }
                };

                const addCard = async () => {
                    if (!newCard.value.name) return alert('请输入卡牌名称');
                    await axios.post(`${API_URL}/api/admin/cards`, newCard.value, { headers: headers() });
                    newCard.value = { name: '', rarity: 'R', imageUrl: '' };
                    fetchData();
                };

                const deleteCard = async (id) => {
                    if (confirm('确定要删除这张卡牌吗？')) {
                        await axios.delete(`${API_URL}/api/admin/cards/${id}`, { headers: headers() });
                        fetchData();
                    }
                };

                const promptEditPrice = async (box) => {
                    const val = prompt(`修改 ${box.name} 的价格（当前: ${box.price}）`, box.price);
                    if (val !== null) {
                        await axios.put(`${API_URL}/api/admin/boxes/${box.id}`, { price: val }, { headers: headers() });
                        fetchData();
                    }
                };

                return {
                    isLoggedIn, password, activeTab, stats, users, cards, boxes, newCard,
                    login, logout, promptEditCoins, addCard, deleteCard, promptEditPrice
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
